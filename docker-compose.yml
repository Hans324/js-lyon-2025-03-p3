version: "3.9"

services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: EXTERNALSHIP
    ports:
      - "3307:3306"

  backend:
    build: ./server
    ports:
      - "3310:3310"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: EXTERNALSHIP

  frontend:
    build: ./client
    ports:
      - "3000:3000"
    depends_on:
      - backend
